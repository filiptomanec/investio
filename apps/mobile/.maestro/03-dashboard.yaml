# Maestro flow: 03-dashboard
#
# Verifies the dashboard tab in the "backend not configured" state.
#
# In the default dev setup the app ships with placeholder env vars
# (EXPO_PUBLIC_SUPABASE_URL is empty or unset). The DashboardScreen component
# checks isBackendConfigured at mount time; when it is false it renders a banner
# instead of attempting a Supabase query.
#
# Expected banner text (mobile.configBackend, CS locale):
#   "Konfiguruj backend — chybí EXPO_PUBLIC_SUPABASE_URL nebo EXPO_PUBLIC_SUPABASE_ANON_KEY v .env"
#
# We assert on the shorter phrase that is reliably visible without being
# locale-brittle.
#
# Translation source:
#   mobile.tabs.dashboard = "Přehled"

appId: com.investio.app
---
- launchApp
# Navigate to the dashboard tab
- tapOn:
    text: "Přehled"
# The graceful empty-state banner should be visible when backend is not
# configured. We assert on the unique word "EXPO_PUBLIC_SUPABASE_URL" which
# is always in the banner text regardless of locale.
- assertVisible:
    text: "EXPO_PUBLIC_SUPABASE_URL"
