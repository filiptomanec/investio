# Maestro flow: 01-launch
#
# Verifies the app launches successfully and the main tab bar is visible.
# The compound interest tab is the default (index screen in (tabs) group).
#
# Requires: EAS dev build installed on the simulator/device.
# See apps/mobile/.maestro/README.md for setup instructions.
#
# Translation source:
#   mobile.tabs.compound = "Složené"  (CS locale, packages/i18n/locales/cs.json)
#   calc.compound.title  = "Složené úročení"

appId: com.investio.app
---
- launchApp
# The bottom tab bar renders the tab label for the compound calculator tab.
# In CS locale this is "Složené" (mobile.tabs.compound key).
- assertVisible:
    text: "Složené"
