# Maestro flow: 02-calc-compound
#
# Verifies the compound interest calculator screen:
#   - Tapping the compound tab navigates to the calculator
#   - Entering a value in the initial amount field
#   - The result element (hero card "Konečná hodnota") is visible after input
#
# Translation source (CS locale):
#   mobile.tabs.compound             = "Složené"
#   calc.compound.fields.initialAmount = "Počáteční částka"
#   calc.compound.results.finalValue   = "Konečná hodnota"
#
# Note: The Input component (apps/mobile/components/ui/input.tsx) renders a
# TextInput. The label text is rendered as an adjacent Text element. Maestro's
# tapOn text: targets the visible label or the input's accessibilityLabel.

appId: com.investio.app
---
- launchApp
# Navigate to the compound calculator tab (tab bar bottom)
- tapOn:
    text: "Složené"
# The screen title should be visible
- assertVisible:
    text: "Složené úročení"
# Tap the initial amount input field by its label text
- tapOn:
    text: "Počáteční částka"
# Clear the existing value and type a new one
- clearText
- inputText: "100000"
# The hero result card shows "Konečná hodnota" label — it is always visible
# because the calc runs with default values on mount. After our input the
# deferred recalc will update the value; we just assert the label is present.
- assertVisible:
    text: "Konečná hodnota"
