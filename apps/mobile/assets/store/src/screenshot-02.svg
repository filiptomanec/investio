<?xml version="1.0" encoding="UTF-8"?>
<!--
  Screenshot 02 — Results card hero, DARK mode, EN.
  Focus: $2.3M future value, breakdown bars, contributions vs interest.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 2796" width="1290" height="2796">
  <defs>
    <radialGradient id="bgGrad" cx="60%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="55%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0b6b62" />
    </radialGradient>
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b1d35" />
      <stop offset="100%" stop-color="#16182b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262945" />
      <stop offset="100%" stop-color="#23263e" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <radialGradient id="resultGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </radialGradient>
    <filter id="phoneShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="30" />
      <feOffset dx="0" dy="30" />
      <feComponentTransfer><feFuncA type="linear" slope="0.45" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="1290" height="2796" fill="url(#bgGrad)" />

  <!-- Headline -->
  <g font-family="-apple-system, system-ui, Inter, sans-serif" fill="#ffffff" text-anchor="middle">
    <text x="645" y="280" font-size="92" font-weight="800" letter-spacing="-2">Compound interest,</text>
    <text x="645" y="400" font-size="92" font-weight="800" letter-spacing="-2">
      <tspan fill="#d6f5ef">visualized</tspan>
    </text>
    <text x="645" y="500" font-size="40" font-weight="500" fill="#d6f5ef" opacity="0.92">
      See contributions vs growth side by side
    </text>
  </g>

  <!-- Phone mock -->
  <g transform="translate(160 650)" filter="url(#phoneShadow)">
    <rect x="0" y="0" width="970" height="2010" rx="84" ry="84" fill="#0a0c18" />
    <rect x="14" y="14" width="942" height="1982" rx="74" ry="74" fill="#1f2237" />
    <g transform="translate(28 28)">
      <clipPath id="screenClip02"><rect x="0" y="0" width="914" height="1954" rx="62" ry="62" /></clipPath>
      <g clip-path="url(#screenClip02)">
        <rect x="0" y="0" width="914" height="1954" fill="url(#screenBg)" />

        <!-- Status bar -->
        <text x="60" y="56" font-family="-apple-system, sans-serif" font-size="28" font-weight="600" fill="#e4e6f4">9:41</text>
        <g transform="translate(800 36)" fill="#e4e6f4">
          <rect x="0" y="6" width="6" height="14" rx="1" />
          <rect x="10" y="2" width="6" height="18" rx="1" />
          <rect x="20" y="-2" width="6" height="22" rx="1" />
          <rect x="40" y="0" width="40" height="20" rx="4" fill="none" stroke="#e4e6f4" stroke-width="2" />
          <rect x="44" y="4" width="28" height="12" rx="2" fill="#34d399" />
        </g>

        <!-- Header -->
        <g transform="translate(40 110)">
          <rect x="0" y="0" width="56" height="56" rx="14" fill="#0d9488" />
          <g transform="translate(28 28) rotate(45)"><rect x="-14" y="-14" width="28" height="28" rx="5" fill="#ffffff" /></g>
          <text x="80" y="38" font-family="-apple-system, Inter, sans-serif" font-size="32" font-weight="800" fill="#e4e6f4">
            INVEST<tspan fill="#34d399">IO</tspan>
          </text>
          <g transform="translate(694 12)">
            <rect width="64" height="32" rx="16" fill="#262945" />
            <text x="32" y="22" font-size="18" font-weight="700" fill="#e4e6f4" text-anchor="middle">EN</text>
          </g>
        </g>

        <text x="40" y="260" font-family="-apple-system, Inter, sans-serif"
              font-size="48" font-weight="800" fill="#e4e6f4">Your results</text>
        <text x="40" y="304" font-size="24" font-weight="500" fill="#a3a8c7">
          30 years • 7.5% return • 2.5% inflation
        </text>

        <!-- Hero result card with glow -->
        <g transform="translate(40 370)">
          <circle cx="417" cy="200" r="380" fill="url(#resultGlow)" />
          <rect width="834" height="400" rx="28" fill="url(#cardGrad)" stroke="#34d39950" stroke-width="1" />
          <text x="40" y="74" font-size="24" font-weight="700" fill="#a3a8c7">Future value (nominal)</text>
          <text x="40" y="200" font-family="Menlo, monospace" font-size="120" font-weight="900" fill="#34d399">$2,341,872</text>
          <g transform="translate(40 260)">
            <rect width="120" height="44" rx="22" fill="#34d39926" />
            <text x="60" y="30" font-size="22" font-weight="700" fill="#34d399" text-anchor="middle">+1,943%</text>
          </g>
          <text x="180" y="290" font-size="22" font-weight="500" fill="#a3a8c7">total return on contributions</text>
          <text x="40" y="356" font-size="22" font-weight="600" fill="#e4e6f4">Real value: $1,118,304 (after inflation)</text>
        </g>

        <!-- Breakdown stat tiles -->
        <g transform="translate(40 810)">
          <!-- Contributions -->
          <g>
            <rect width="403" height="220" rx="24" fill="url(#cardGrad)" stroke="#ffffff10" />
            <text x="28" y="58" font-size="22" font-weight="700" fill="#a3a8c7">Contributions</text>
            <text x="28" y="148" font-family="Menlo, monospace" font-size="52" font-weight="800" fill="#e4e6f4">$640,000</text>
            <text x="28" y="190" font-size="20" font-weight="500" fill="#a3a8c7">$1,500/mo × 30y + $100k</text>
          </g>
          <!-- Interest -->
          <g transform="translate(431 0)">
            <rect width="403" height="220" rx="24" fill="url(#cardGrad)" stroke="#34d39950" />
            <text x="28" y="58" font-size="22" font-weight="700" fill="#34d399">Interest earned</text>
            <text x="28" y="148" font-family="Menlo, monospace" font-size="52" font-weight="800" fill="#34d399">$1,701,872</text>
            <text x="28" y="190" font-size="20" font-weight="500" fill="#a3a8c7">73% of total — compounding works</text>
          </g>
        </g>

        <!-- Composition bar -->
        <g transform="translate(40 1080)">
          <text x="0" y="0" font-size="22" font-weight="700" fill="#a3a8c7">Composition</text>
          <g transform="translate(0 24)">
            <rect width="834" height="44" rx="22" fill="#262945" />
            <!-- Contributions ≈ 27% -->
            <rect x="0" y="0" width="225" height="44" rx="22" fill="#a3a8c7" />
            <!-- Interest 73% — overlay rounded right -->
            <rect x="225" y="0" width="609" height="44" rx="0" fill="#34d399" />
            <rect x="225" y="0" width="609" height="44" rx="22" fill="#34d399" mask="url(#none)" />
          </g>
          <g transform="translate(0 92)" font-size="20">
            <circle cx="10" cy="10" r="8" fill="#a3a8c7" />
            <text x="28" y="16" fill="#a3a8c7" font-weight="600">Contributions 27%</text>
            <circle cx="350" cy="10" r="8" fill="#34d399" />
            <text x="368" y="16" fill="#34d399" font-weight="600">Interest 73%</text>
          </g>
        </g>

        <!-- Small "what if" card -->
        <g transform="translate(40 1280)">
          <rect width="834" height="180" rx="24" fill="url(#cardGrad)" stroke="#ffffff10" />
          <text x="28" y="58" font-size="22" font-weight="700" fill="#a3a8c7">What if you start 5 years later?</text>
          <text x="28" y="130" font-family="Menlo, monospace" font-size="44" font-weight="800" fill="#ef4444">−$612,300</text>
          <text x="290" y="130" font-size="20" font-weight="500" fill="#a3a8c7">future value lost</text>
        </g>

        <!-- Home indicator -->
        <rect x="307" y="1900" width="300" height="8" rx="4" fill="#ffffff" opacity="0.4" />
      </g>
    </g>
    <rect x="385" y="56" width="200" height="50" rx="25" fill="#000000" />
  </g>
</svg>
