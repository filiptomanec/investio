<?xml version="1.0" encoding="UTF-8"?>
<!--
  Adaptive icon foreground.
  - 1024x1024 canvas with the diamond mark on a transparent background
  - ~25% safe-area padding (mark fits inside the central 66% diameter)
  - The OS draws the brand-tinted background behind this
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="diamond" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#eaf7f5" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" />
      <feOffset dx="0" dy="8" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- transparent background -->

  <!-- Diamond: smaller than icon.svg to leave safe-area padding for the OS mask -->
  <g transform="translate(512 512) rotate(45)" filter="url(#shadow)">
    <rect x="-180" y="-180" width="360" height="360" rx="56" ry="56" fill="url(#diamond)" />
    <rect x="-180" y="-180" width="360" height="360" rx="56" ry="56"
          fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2" />
  </g>
</svg>
