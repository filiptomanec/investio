<?xml version="1.0" encoding="UTF-8"?>
<!--
  Screenshot 05 — CS locale, DARK mode. Inflation-adjusted real value emphasis.
  Czech currency format with space thousands and "Kč" suffix.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 2796" width="1290" height="2796">
  <defs>
    <radialGradient id="bgGrad" cx="60%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="55%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0b6b62" />
    </radialGradient>
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b1d35" />
      <stop offset="100%" stop-color="#16182b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262945" />
      <stop offset="100%" stop-color="#23263e" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <radialGradient id="warnGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    <filter id="phoneShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="30" />
      <feOffset dx="0" dy="30" />
      <feComponentTransfer><feFuncA type="linear" slope="0.45" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="1290" height="2796" fill="url(#bgGrad)" />

  <g font-family="-apple-system, system-ui, Inter, sans-serif" fill="#ffffff" text-anchor="middle">
    <text x="645" y="280" font-size="92" font-weight="800" letter-spacing="-2">Inflace?</text>
    <text x="645" y="400" font-size="92" font-weight="800" letter-spacing="-2">Spočítej reálnou hodnotu</text>
    <text x="645" y="500" font-size="40" font-weight="500" fill="#d6f5ef" opacity="0.92">
      Skutečná kupní síla tvých úspor
    </text>
  </g>

  <g transform="translate(160 650)" filter="url(#phoneShadow)">
    <rect x="0" y="0" width="970" height="2010" rx="84" ry="84" fill="#0a0c18" />
    <rect x="14" y="14" width="942" height="1982" rx="74" ry="74" fill="#1f2237" />
    <g transform="translate(28 28)">
      <clipPath id="screenClip05"><rect x="0" y="0" width="914" height="1954" rx="62" ry="62" /></clipPath>
      <g clip-path="url(#screenClip05)">
        <rect x="0" y="0" width="914" height="1954" fill="url(#screenBg)" />

        <text x="60" y="56" font-family="-apple-system, sans-serif" font-size="28" font-weight="600" fill="#e4e6f4">9:41</text>
        <g transform="translate(800 36)" fill="#e4e6f4">
          <rect x="0" y="6" width="6" height="14" rx="1" />
          <rect x="10" y="2" width="6" height="18" rx="1" />
          <rect x="20" y="-2" width="6" height="22" rx="1" />
          <rect x="40" y="0" width="40" height="20" rx="4" fill="none" stroke="#e4e6f4" stroke-width="2" />
          <rect x="44" y="4" width="28" height="12" rx="2" fill="#34d399" />
        </g>

        <!-- Header -->
        <g transform="translate(40 110)">
          <rect x="0" y="0" width="56" height="56" rx="14" fill="#0d9488" />
          <g transform="translate(28 28) rotate(45)"><rect x="-14" y="-14" width="28" height="28" rx="5" fill="#ffffff" /></g>
          <text x="80" y="38" font-family="-apple-system, Inter, sans-serif" font-size="32" font-weight="800" fill="#e4e6f4">
            INVEST<tspan fill="#34d399">IO</tspan>
          </text>
          <g transform="translate(694 12)">
            <rect width="64" height="32" rx="16" fill="#0d9488" />
            <text x="32" y="22" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">CS</text>
          </g>
        </g>

        <text x="40" y="260" font-family="-apple-system, Inter, sans-serif"
              font-size="48" font-weight="800" fill="#e4e6f4">Reálná hodnota</text>
        <text x="40" y="304" font-size="24" font-weight="500" fill="#a3a8c7">Po zohlednění inflace 2,5 %</text>

        <!-- Nominal vs Real side-by-side hero -->
        <g transform="translate(40 360)">
          <!-- Nominal card -->
          <g>
            <rect width="403" height="320" rx="24" fill="url(#cardGrad)" stroke="#34d39950" />
            <text x="28" y="58" font-size="22" font-weight="700" fill="#a3a8c7">Nominální</text>
            <text x="28" y="170" font-family="Menlo, monospace" font-size="56" font-weight="900" fill="#34d399">52 786 240</text>
            <text x="28" y="206" font-size="22" font-weight="600" fill="#34d399">Kč</text>
            <g transform="translate(28 240)">
              <rect width="180" height="40" rx="20" fill="#34d39926" />
              <text x="90" y="27" font-size="18" font-weight="700" fill="#34d399" text-anchor="middle">+1 943 % růst</text>
            </g>
          </g>
          <!-- Real card -->
          <g transform="translate(431 0)">
            <circle cx="201" cy="160" r="270" fill="url(#warnGlow)" />
            <rect width="403" height="320" rx="24" fill="url(#cardGrad)" stroke="#fbbf2460" />
            <text x="28" y="58" font-size="22" font-weight="700" fill="#fbbf24">Reálné (dnes)</text>
            <text x="28" y="170" font-family="Menlo, monospace" font-size="56" font-weight="900" fill="#fbbf24">25 187 410</text>
            <text x="28" y="206" font-size="22" font-weight="600" fill="#fbbf24">Kč</text>
            <g transform="translate(28 240)">
              <rect width="232" height="40" rx="20" fill="#fbbf2426" />
              <text x="116" y="27" font-size="18" font-weight="700" fill="#fbbf24" text-anchor="middle">−52 % kupní síla</text>
            </g>
          </g>
        </g>

        <!-- Inflation impact illustration: shrinking bar -->
        <g transform="translate(40 730)">
          <rect width="834" height="240" rx="24" fill="url(#cardGrad)" stroke="#ffffff10" />
          <text x="28" y="58" font-size="22" font-weight="700" fill="#a3a8c7">Co inflace ukousne</text>

          <g transform="translate(28 90)">
            <!-- 100% bar -->
            <rect width="778" height="56" rx="12" fill="#16182b" />
            <!-- Eaten by inflation 52% (red) -->
            <rect x="0" y="0" width="404" height="56" rx="12" fill="#ef444450" />
            <text x="202" y="36" font-size="20" font-weight="700" fill="#ef4444" text-anchor="middle">Inflace: 27 598 830 Kč</text>
          </g>
          <g transform="translate(28 160)">
            <text font-size="20" font-weight="600" fill="#a3a8c7">Reálná hodnota za 30 let je menší než vidíš v nominálu.</text>
            <text y="32" font-size="20" font-weight="600" fill="#a3a8c7">Investio počítá obojí současně.</text>
          </g>
        </g>

        <!-- Inputs reminder -->
        <g transform="translate(40 1020)">
          <text font-size="22" font-weight="700" fill="#a3a8c7">Zadané hodnoty</text>
          <g transform="translate(0 36)">
            <rect width="403" height="120" rx="20" fill="url(#cardGrad)" stroke="#ffffff10" />
            <text x="24" y="44" font-size="20" font-weight="600" fill="#a3a8c7">Měsíčně</text>
            <text x="24" y="92" font-family="Menlo, monospace" font-size="36" font-weight="800" fill="#e4e6f4">35 000 Kč</text>
          </g>
          <g transform="translate(431 36)">
            <rect width="403" height="120" rx="20" fill="url(#cardGrad)" stroke="#ffffff10" />
            <text x="24" y="44" font-size="20" font-weight="600" fill="#a3a8c7">Výnos / rok</text>
            <text x="24" y="92" font-family="Menlo, monospace" font-size="36" font-weight="800" fill="#e4e6f4">7,5 %</text>
          </g>
          <g transform="translate(0 176)">
            <rect width="403" height="120" rx="20" fill="url(#cardGrad)" stroke="#ffffff10" />
            <text x="24" y="44" font-size="20" font-weight="600" fill="#a3a8c7">Inflace</text>
            <text x="24" y="92" font-family="Menlo, monospace" font-size="36" font-weight="800" fill="#fbbf24">2,5 %</text>
          </g>
          <g transform="translate(431 176)">
            <rect width="403" height="120" rx="20" fill="url(#cardGrad)" stroke="#ffffff10" />
            <text x="24" y="44" font-size="20" font-weight="600" fill="#a3a8c7">Doba</text>
            <text x="24" y="92" font-family="Menlo, monospace" font-size="36" font-weight="800" fill="#e4e6f4">30 let</text>
          </g>
        </g>

        <rect x="307" y="1900" width="300" height="8" rx="4" fill="#ffffff" opacity="0.4" />
      </g>
    </g>
    <rect x="385" y="56" width="200" height="50" rx="25" fill="#000000" />
  </g>
</svg>
