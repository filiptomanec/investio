<?xml version="1.0" encoding="UTF-8"?>
<!--
  Screenshot 03 — Projection chart, DARK mode, EN.
  Stacked area chart: contributions (muted), nominal (teal), real (lighter teal) over 30 years.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 2796" width="1290" height="2796">
  <defs>
    <radialGradient id="bgGrad" cx="60%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="55%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0b6b62" />
    </radialGradient>
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b1d35" />
      <stop offset="100%" stop-color="#16182b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262945" />
      <stop offset="100%" stop-color="#23263e" />
    </linearGradient>
    <linearGradient id="nominalFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="realFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0.02" />
    </linearGradient>
    <filter id="phoneShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="30" />
      <feOffset dx="0" dy="30" />
      <feComponentTransfer><feFuncA type="linear" slope="0.45" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="1290" height="2796" fill="url(#bgGrad)" />

  <g font-family="-apple-system, system-ui, Inter, sans-serif" fill="#ffffff" text-anchor="middle">
    <text x="645" y="280" font-size="92" font-weight="800" letter-spacing="-2">See your growth</text>
    <text x="645" y="400" font-size="92" font-weight="800" letter-spacing="-2">over time</text>
    <text x="645" y="500" font-size="40" font-weight="500" fill="#d6f5ef" opacity="0.92">
      Year-by-year projection chart
    </text>
  </g>

  <g transform="translate(160 650)" filter="url(#phoneShadow)">
    <rect x="0" y="0" width="970" height="2010" rx="84" ry="84" fill="#0a0c18" />
    <rect x="14" y="14" width="942" height="1982" rx="74" ry="74" fill="#1f2237" />
    <g transform="translate(28 28)">
      <clipPath id="screenClip03"><rect x="0" y="0" width="914" height="1954" rx="62" ry="62" /></clipPath>
      <g clip-path="url(#screenClip03)">
        <rect x="0" y="0" width="914" height="1954" fill="url(#screenBg)" />

        <text x="60" y="56" font-family="-apple-system, sans-serif" font-size="28" font-weight="600" fill="#e4e6f4">9:41</text>
        <g transform="translate(800 36)" fill="#e4e6f4">
          <rect x="0" y="6" width="6" height="14" rx="1" />
          <rect x="10" y="2" width="6" height="18" rx="1" />
          <rect x="20" y="-2" width="6" height="22" rx="1" />
          <rect x="40" y="0" width="40" height="20" rx="4" fill="none" stroke="#e4e6f4" stroke-width="2" />
          <rect x="44" y="4" width="28" height="12" rx="2" fill="#34d399" />
        </g>

        <!-- Header -->
        <g transform="translate(40 110)">
          <rect x="0" y="0" width="56" height="56" rx="14" fill="#0d9488" />
          <g transform="translate(28 28) rotate(45)"><rect x="-14" y="-14" width="28" height="28" rx="5" fill="#ffffff" /></g>
          <text x="80" y="38" font-family="-apple-system, Inter, sans-serif" font-size="32" font-weight="800" fill="#e4e6f4">
            INVEST<tspan fill="#34d399">IO</tspan>
          </text>
          <g transform="translate(694 12)">
            <rect width="64" height="32" rx="16" fill="#262945" />
            <text x="32" y="22" font-size="18" font-weight="700" fill="#e4e6f4" text-anchor="middle">EN</text>
          </g>
        </g>

        <text x="40" y="260" font-family="-apple-system, Inter, sans-serif"
              font-size="48" font-weight="800" fill="#e4e6f4">Projection</text>
        <text x="40" y="304" font-size="24" font-weight="500" fill="#a3a8c7">Year 1 → Year 30</text>

        <!-- Chart card -->
        <g transform="translate(40 360)">
          <rect width="834" height="980" rx="28" fill="url(#cardGrad)" stroke="#ffffff10" />

          <!-- Y axis labels -->
          <g font-size="20" font-weight="600" fill="#a3a8c7" font-family="Menlo, monospace">
            <text x="36" y="68">$2.5M</text>
            <text x="36" y="216">$2.0M</text>
            <text x="36" y="364">$1.5M</text>
            <text x="36" y="512">$1.0M</text>
            <text x="36" y="660">$500k</text>
            <text x="36" y="808">$0</text>
          </g>

          <!-- Gridlines -->
          <g stroke="#ffffff10" stroke-width="1" stroke-dasharray="4 6">
            <line x1="140" y1="60" x2="780" y2="60" />
            <line x1="140" y1="208" x2="780" y2="208" />
            <line x1="140" y1="356" x2="780" y2="356" />
            <line x1="140" y1="504" x2="780" y2="504" />
            <line x1="140" y1="652" x2="780" y2="652" />
            <line x1="140" y1="800" x2="780" y2="800" />
          </g>

          <!-- Nominal area (teal): exponential growth from $100k to $2.34M over 30y, mapped to y(800 → 64).
               Approximate with monotone polyline. -->
          <!-- Pixel coords: x from 140 to 780 (range 640), 30 years → step ~21.3px per year. -->
          <!-- y baseline 800, top 60. Value 0=800, $2.5M=60. -->
          <!-- Compute approximate values: nominal(y) = 100k + monthlyContrib FV + return. Hand-drawn smooth curve. -->
          <path d="M140,770
                   L162,762 L184,752 L206,740 L228,726 L250,710
                   L272,692 L294,672 L316,650 L338,624 L360,596
                   L382,564 L404,530 L426,492 L448,452 L470,410
                   L492,366 L514,318 L536,270 L558,222 L580,176
                   L602,134 L624,100 L646,76 L668,62 L690,54
                   L712,52 L734,56 L756,64 L780,76
                   L780,800 L140,800 Z"
                fill="url(#nominalFill)" />
          <path d="M140,770
                   L162,762 L184,752 L206,740 L228,726 L250,710
                   L272,692 L294,672 L316,650 L338,624 L360,596
                   L382,564 L404,530 L426,492 L448,452 L470,410
                   L492,366 L514,318 L536,270 L558,222 L580,176
                   L602,134 L624,100 L646,76 L668,62 L690,54
                   L712,52 L734,56 L756,64 L780,76"
                stroke="#34d399" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" />

          <!-- Real (inflation-adjusted) area – flatter, lower -->
          <path d="M140,780
                   L162,775 L184,768 L206,760 L228,750 L250,740
                   L272,728 L294,716 L316,700 L338,682 L360,664
                   L382,642 L404,620 L426,594 L448,568 L470,540
                   L492,510 L514,478 L536,446 L558,414 L580,380
                   L602,346 L624,316 L646,290 L668,268 L690,250
                   L712,238 L734,232 L756,232 L780,238
                   L780,800 L140,800 Z"
                fill="url(#realFill)" />
          <path d="M140,780
                   L162,775 L184,768 L206,760 L228,750 L250,740
                   L272,728 L294,716 L316,700 L338,682 L360,664
                   L382,642 L404,620 L426,594 L448,568 L470,540
                   L492,510 L514,478 L536,446 L558,414 L580,380
                   L602,346 L624,316 L646,290 L668,268 L690,250
                   L712,238 L734,232 L756,232 L780,238"
                stroke="#5eead4" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" />

          <!-- Contributions line (dashed muted) - near-linear from $100k to $640k -->
          <path d="M140,778 L780,704"
                stroke="#a3a8c7" stroke-width="3" fill="none" stroke-dasharray="8 8" stroke-linecap="round" />

          <!-- X axis labels -->
          <g font-size="20" font-weight="600" fill="#a3a8c7" font-family="Menlo, monospace">
            <text x="140" y="840" text-anchor="middle">Y1</text>
            <text x="268" y="840" text-anchor="middle">Y6</text>
            <text x="396" y="840" text-anchor="middle">Y12</text>
            <text x="524" y="840" text-anchor="middle">Y18</text>
            <text x="652" y="840" text-anchor="middle">Y24</text>
            <text x="780" y="840" text-anchor="middle">Y30</text>
          </g>

          <!-- Highlight last point + tooltip-like callout -->
          <circle cx="780" cy="76" r="10" fill="#34d399" stroke="#16182b" stroke-width="4" />
          <g transform="translate(540 90)">
            <rect width="240" height="100" rx="14" fill="#16182b" stroke="#34d39950" />
            <text x="18" y="34" font-size="18" font-weight="600" fill="#a3a8c7">Year 30 • Nominal</text>
            <text x="18" y="76" font-family="Menlo, monospace" font-size="32" font-weight="800" fill="#34d399">$2.34M</text>
          </g>

          <!-- Legend -->
          <g transform="translate(36 900)" font-size="22" font-weight="600">
            <circle cx="10" cy="10" r="8" fill="#34d399" />
            <text x="30" y="18" fill="#e4e6f4">Nominal</text>
            <circle cx="170" cy="10" r="8" fill="#5eead4" />
            <text x="190" y="18" fill="#e4e6f4">Real</text>
            <g transform="translate(290 6)">
              <line x1="0" y1="6" x2="24" y2="6" stroke="#a3a8c7" stroke-width="3" stroke-dasharray="6 6" />
            </g>
            <text x="330" y="18" fill="#e4e6f4">Contributions</text>
          </g>
        </g>

        <!-- Milestones row -->
        <g transform="translate(40 1380)">
          <text font-size="22" font-weight="700" fill="#a3a8c7">Milestones</text>
          <g transform="translate(0 28)">
            <rect width="834" height="84" rx="16" fill="url(#cardGrad)" />
            <text x="24" y="40" font-size="22" font-weight="700" fill="#e4e6f4">Year 10</text>
            <text x="24" y="68" font-size="18" fill="#a3a8c7">$338,200 nominal</text>
            <text x="450" y="40" font-size="22" font-weight="700" fill="#34d399">+24% real</text>
          </g>
          <g transform="translate(0 124)">
            <rect width="834" height="84" rx="16" fill="url(#cardGrad)" />
            <text x="24" y="40" font-size="22" font-weight="700" fill="#e4e6f4">Year 20</text>
            <text x="24" y="68" font-size="18" fill="#a3a8c7">$932,500 nominal</text>
            <text x="450" y="40" font-size="22" font-weight="700" fill="#34d399">+187% real</text>
          </g>
        </g>

        <rect x="307" y="1900" width="300" height="8" rx="4" fill="#ffffff" opacity="0.4" />
      </g>
    </g>
    <rect x="385" y="56" width="200" height="50" rx="25" fill="#000000" />
  </g>
</svg>
