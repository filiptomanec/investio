<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Investio — Kalkulačka složeného úročení</title>
    <meta
      name="description"
      content="Spočítejte budoucí hodnotu vašich investic, pasivní příjem a započtěte inflaci."
    />
    <!-- Pre-hydration theme bootstrap: sets dark class before first paint to avoid flicker -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("investio-theme");
          if (t === "dark" || !t) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/spa-entry.tsx"></script>
  </body>
</html>
