<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Subtle teal background gradient: brighter top-right, deeper bottom-left -->
    <radialGradient id="bg" cx="70%" cy="22%" r="95%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="55%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0b7a70" />
    </radialGradient>

    <!-- Diamond: subtle vertical gradient so it has a bit of depth -->
    <linearGradient id="diamond" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#eaf7f5" />
    </linearGradient>

    <!-- Drop shadow under the diamond -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" />
      <feOffset dx="0" dy="10" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.32" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle accent halo behind the diamond -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- iOS will auto-mask the corners; we draw a full square. -->
  <rect width="1024" height="1024" fill="url(#bg)" />

  <!-- Subtle accent halo behind diamond -->
  <circle cx="512" cy="512" r="380" fill="url(#halo)" />

  <!-- Diamond: rotated rounded square. Side 440px, rotated 45°, centered. -->
  <!-- Rotation in SVG: use group transform. -->
  <g transform="translate(512 512) rotate(45)" filter="url(#shadow)">
    <rect x="-220" y="-220" width="440" height="440" rx="64" ry="64" fill="url(#diamond)" />
    <!-- Subtle inner highlight stroke -->
    <rect x="-220" y="-220" width="440" height="440" rx="64" ry="64"
          fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2" />
  </g>
</svg>
