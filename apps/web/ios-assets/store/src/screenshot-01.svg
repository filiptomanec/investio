<?xml version="1.0" encoding="UTF-8"?>
<!--
  Screenshot 01 — Calculator inputs, DARK mode, EN locale.
  Canvas: 1290 x 2796 (App Store 6.7" iPhone). Headline band on top ~700px.
  Phone mock: device pixels 1170×2532 scaled to fit; we draw at ~1000×2160 below the headline.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 2796" width="1290" height="2796">
  <defs>
    <radialGradient id="bgGrad" cx="60%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="55%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0b6b62" />
    </radialGradient>
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#eaf7f5" />
    </linearGradient>
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b1d35" />
      <stop offset="100%" stop-color="#16182b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262945" />
      <stop offset="100%" stop-color="#23263e" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="phoneShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="30" />
      <feOffset dx="0" dy="30" />
      <feComponentTransfer><feFuncA type="linear" slope="0.45" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1290" height="2796" fill="url(#bgGrad)" />

  <!-- Headline area -->
  <g font-family="-apple-system, system-ui, Inter, sans-serif" fill="#ffffff" text-anchor="middle">
    <text x="645" y="280" font-size="92" font-weight="800" letter-spacing="-2">Plan your</text>
    <text x="645" y="400" font-size="92" font-weight="800" letter-spacing="-2">financial future</text>
    <text x="645" y="500" font-size="40" font-weight="500" fill="#d6f5ef" opacity="0.92">
      Compound interest, made simple
    </text>
  </g>

  <!-- Phone frame: outer body 970x2010, rounded; screen 920x1960 inside -->
  <!-- Center: x=645, top y=650 → phone spans 160..1130, 650..2660 -->
  <g transform="translate(160 650)" filter="url(#phoneShadow)">
    <!-- Phone body -->
    <rect x="0" y="0" width="970" height="2010" rx="84" ry="84" fill="#0a0c18" />
    <!-- Bezel ring -->
    <rect x="14" y="14" width="942" height="1982" rx="74" ry="74" fill="#1f2237" />
    <!-- Screen -->
    <g transform="translate(28 28)">
      <clipPath id="screenClip01">
        <rect x="0" y="0" width="914" height="1954" rx="62" ry="62" />
      </clipPath>
      <g clip-path="url(#screenClip01)">
        <rect x="0" y="0" width="914" height="1954" fill="url(#screenBg)" />

        <!-- Status bar -->
        <g font-family="-apple-system, system-ui, sans-serif" fill="#e4e6f4">
          <text x="60" y="56" font-size="28" font-weight="600">9:41</text>
          <!-- signal/wifi/battery icons abstracted -->
          <g transform="translate(800 36)" fill="#e4e6f4">
            <rect x="0" y="6" width="6" height="14" rx="1" />
            <rect x="10" y="2" width="6" height="18" rx="1" />
            <rect x="20" y="-2" width="6" height="22" rx="1" />
            <rect x="40" y="0" width="40" height="20" rx="4" fill="none" stroke="#e4e6f4" stroke-width="2" />
            <rect x="44" y="4" width="28" height="12" rx="2" fill="#34d399" />
          </g>
        </g>

        <!-- Header -->
        <g transform="translate(40 110)">
          <!-- Logo square -->
          <rect x="0" y="0" width="56" height="56" rx="14" fill="#0d9488" />
          <g transform="translate(28 28) rotate(45)">
            <rect x="-14" y="-14" width="28" height="28" rx="5" fill="#ffffff" />
          </g>
          <text x="80" y="38" font-family="-apple-system, Inter, sans-serif" font-size="32" font-weight="800" fill="#e4e6f4">
            INVEST<tspan fill="#34d399">IO</tspan>
          </text>
          <!-- Right icons -->
          <g transform="translate(694 12)">
            <rect x="0" y="0" width="64" height="32" rx="16" fill="#262945" />
            <text x="32" y="22" font-size="18" font-weight="700" fill="#e4e6f4" text-anchor="middle">EN</text>
          </g>
          <g transform="translate(770 6)">
            <rect x="0" y="0" width="44" height="44" rx="12" fill="#262945" />
            <circle cx="22" cy="22" r="8" fill="none" stroke="#e4e6f4" stroke-width="2" />
          </g>
        </g>

        <!-- Section title -->
        <text x="40" y="260" font-family="-apple-system, Inter, sans-serif"
              font-size="48" font-weight="800" fill="#e4e6f4">Compound interest</text>
        <text x="40" y="304" font-family="-apple-system, Inter, sans-serif"
              font-size="24" font-weight="500" fill="#a3a8c7">Calculate your long-term growth</text>

        <!-- Inputs card -->
        <g transform="translate(40 350)">
          <rect x="0" y="0" width="834" height="1140" rx="28" fill="url(#cardGrad)" stroke="#34d39920" stroke-width="1" />

          <!-- Field: Initial deposit -->
          <g transform="translate(36 36)">
            <text font-size="22" font-weight="600" fill="#a3a8c7">Initial deposit</text>
            <g transform="translate(0 30)">
              <rect width="762" height="84" rx="14" fill="#16182b" stroke="#ffffff20" />
              <text x="24" y="56" font-family="Menlo, monospace" font-size="34" font-weight="700" fill="#e4e6f4">100,000</text>
              <text x="730" y="56" font-size="24" font-weight="600" fill="#a3a8c7" text-anchor="end">$</text>
            </g>
          </g>

          <!-- Field: Monthly contribution -->
          <g transform="translate(36 184)">
            <text font-size="22" font-weight="600" fill="#a3a8c7">Monthly contribution</text>
            <g transform="translate(0 30)">
              <rect width="762" height="84" rx="14" fill="#16182b" stroke="#ffffff20" />
              <text x="24" y="56" font-family="Menlo, monospace" font-size="34" font-weight="700" fill="#e4e6f4">1,500</text>
              <text x="730" y="56" font-size="24" font-weight="600" fill="#a3a8c7" text-anchor="end">$</text>
            </g>
          </g>

          <!-- Field: Annual return (%) -->
          <g transform="translate(36 332)">
            <text font-size="22" font-weight="600" fill="#a3a8c7">Expected annual return</text>
            <g transform="translate(0 30)">
              <rect width="762" height="84" rx="14" fill="#16182b" stroke="#ffffff20" />
              <text x="24" y="56" font-family="Menlo, monospace" font-size="34" font-weight="700" fill="#e4e6f4">7.5</text>
              <text x="730" y="56" font-size="24" font-weight="600" fill="#a3a8c7" text-anchor="end">%</text>
            </g>
          </g>

          <!-- Field: Years -->
          <g transform="translate(36 480)">
            <text font-size="22" font-weight="600" fill="#a3a8c7">Investment horizon</text>
            <g transform="translate(0 30)">
              <rect width="762" height="84" rx="14" fill="#16182b" stroke="#ffffff20" />
              <text x="24" y="56" font-family="Menlo, monospace" font-size="34" font-weight="700" fill="#e4e6f4">30</text>
              <text x="730" y="56" font-size="24" font-weight="600" fill="#a3a8c7" text-anchor="end">years</text>
            </g>
          </g>

          <!-- Inflation toggle row -->
          <g transform="translate(36 632)">
            <rect width="762" height="84" rx="14" fill="#16182b40" />
            <text x="24" y="40" font-size="22" font-weight="700" fill="#e4e6f4">Inflation adjustment</text>
            <text x="24" y="68" font-size="18" font-weight="500" fill="#a3a8c7">Show real-value purchasing power</text>
            <g transform="translate(680 22)">
              <rect width="64" height="36" rx="18" fill="#34d399" />
              <circle cx="46" cy="18" r="14" fill="#ffffff" />
            </g>
          </g>

          <!-- Inflation rate field -->
          <g transform="translate(36 740)">
            <text font-size="22" font-weight="600" fill="#a3a8c7">Annual inflation rate</text>
            <g transform="translate(0 30)">
              <rect width="762" height="84" rx="14" fill="#16182b" stroke="#ffffff20" />
              <text x="24" y="56" font-family="Menlo, monospace" font-size="34" font-weight="700" fill="#e4e6f4">2.5</text>
              <text x="730" y="56" font-size="24" font-weight="600" fill="#a3a8c7" text-anchor="end">%</text>
            </g>
          </g>

          <!-- Quick result preview -->
          <g transform="translate(36 900)">
            <rect width="762" height="200" rx="20" fill="url(#brandGrad)" opacity="0.18" />
            <rect width="762" height="200" rx="20" fill="none" stroke="#34d39950" />
            <text x="36" y="58" font-size="22" font-weight="700" fill="#a3a8c7">Future value (nominal)</text>
            <text x="36" y="130" font-family="Menlo, monospace" font-size="68" font-weight="900" fill="#34d399">$2,341,872</text>
            <text x="36" y="172" font-size="22" font-weight="500" fill="#a3a8c7">in 30 years • +18% vs contributions only</text>
          </g>
        </g>

        <!-- Home indicator -->
        <rect x="307" y="1900" width="300" height="8" rx="4" fill="#ffffff" opacity="0.4" />
      </g>
    </g>
    <!-- Dynamic Island -->
    <rect x="385" y="56" width="200" height="50" rx="25" fill="#000000" />
  </g>
</svg>
